name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -count=1 -tags ssacheck ./internal/... ./cmd/...

  program-tests:
    name: Program Tests (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64-linux
            runner: ubuntu-latest
          - target: arm64-linux
            runner: ubuntu-24.04-arm
          - target: x64-darwin
            runner: macos-latest
          - target: arm64-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Ensure Rosetta 2
        if: matrix.target == 'x64-darwin'
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Run program tests
        env:
          TAG: ~wip
          TARGET: ${{ matrix.target }}
        run: go test -count=1 ./test/...
